name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Regression tests (no real credentials or network)
        run: swift test
      - name: Build and verify free distribution package
        run: scripts/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: MacTokenGauge-ad-hoc
          path: dist/
          if-no-files-found: error
