name: Prepare release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift test
      - run: scripts/package.sh dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: MacTokenGauge-release
          path: dist/
          if-no-files-found: error
# Download these artifacts, review them, then attach them to a GitHub Release.
# This workflow deliberately needs no Developer ID or paid Apple membership.
